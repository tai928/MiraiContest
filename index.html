<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirai MV</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="mv">
    <div class="bg-layer bg1"></div>
    <div class="bg-layer bg2"></div>
    <div class="noise"></div>
    <div class="scanline"></div>
  
    <div class="vignette"></div>
    <div id="flash" class="flash"></div>
    <div id="centerGlow" class="center-glow"></div>
  
    <section class="lyrics">
      <p id="subLyric" class="sub-lyric">next phrase</p>
      <h1 id="mainLyric" class="main-lyric">Loading...</h1>
    </section>
  
    <div class="controls">
      <button id="playButton" class="play-button">Play</button>
      <div id="time" class="time">0.0s</div>
    </div>
  
    <div id="media" class="hidden-media"></div>
  </main>

  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/textalive-app-api/dist/index.js"></script>
  <script src="./script.js"></script>
</body>
</html>
